apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          envFrom:
            - secretRef: {name: minimeet-db-secret}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      initContainers:
        - name: restore-redis-rdb
          image: docker.io/library/redis:7-alpine
          command: ["sh", "-ec"]
          args:
            - |
              if [ -f /data/.minimeet-seeded ]; then
                echo "Redis data already initialized"
              elif [ -e /data/dump.rdb ] || [ -e /data/appendonlydir ]; then
                echo "Refusing to overwrite existing Redis data" >&2
                exit 1
              else
                cp /snapshot/dump.rdb /data/dump.rdb
                chown redis:redis /data/dump.rdb
                touch /data/.minimeet-seeded
                echo "Redis RDB backup staged successfully"
              fi
          volumeMounts:
            - {name: redis-data, mountPath: /data}
            - {name: redis-backup, mountPath: /snapshot, readOnly: true}
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["redis-server", "--dir", "/data", "--dbfilename", "dump.rdb", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          volumeMounts:
            - {name: redis-data, mountPath: /data}
          readinessProbe:
            exec:
              command: ["redis-cli", "PING"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim: {claimName: redis-data}
        - name: redis-backup
          configMap: {name: minimeet-redis-rdb}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
