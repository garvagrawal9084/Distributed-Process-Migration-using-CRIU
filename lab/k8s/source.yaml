apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          envFrom:
            - secretRef: {name: minimeet-db-secret}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimeet-backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: minimeet-backend}
  template:
    metadata:
      labels: {app: minimeet-backend}
    spec:
      containers:
        - name: backend
          image: localhost/minimeet-backend:v3
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
          envFrom:
            - secretRef: {name: minimeet-app-config}
          ports: [{containerPort: 8000}]
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: worker
          image: localhost/minimeet-backend:v3
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - secretRef: {name: minimeet-app-config}
          volumeMounts:
            - name: shared-data
              mountPath: /shared
        - name: sidecar
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "touch /shared/worker.log && tail -F /shared/worker.log"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      volumes:
        - name: shared-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minimeet-backend
spec:
  selector: {app: minimeet-backend}
  ports: [{port: 8000, targetPort: 8000}]
